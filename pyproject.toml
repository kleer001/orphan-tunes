[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orphan-tunes"
version = "0.1.0"
description = "Rebuild iTunes playlists against the music files you still have"
readme = "README.md"
requires-python = ">=3.11"   # tomllib
license = { text = "MIT" }
authors = [{ name = "kleer001" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["main.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
