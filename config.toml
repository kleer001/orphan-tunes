# Every path the tools need. A relative path is read against this folder.

# The library file iTunes exports. On a Mac it is "iTunes Music Library.xml",
# usually beside the iTunes Library.itl file.
library = "data/iTunes Music Library.xml"

# Plays, ratings and smart playlists that the page records through serve.py.
# Keep it outside the browser folder, so a rebuild cannot lose it.
state = "data/state.json"

[music]
# The folder the library XML recorded your music under. The XML's "Music Folder"
# key holds it as a URL: drop the leading file:// and write each %20 as a space.
recorded_root = "/Users/you/Music/iTunes/iTunes Media"
# Where that same folder is now. It replaces recorded_root at the start of every
# track path.
local_root = "/mnt/archive/iTunes Media"

[output]
# The .m3u8 files, one per playlist.
playlists = "/mnt/archive/playlists"
# The browsable page, its data, and the playlist the Play button hands to VLC.
browser = "/mnt/archive/browser"
